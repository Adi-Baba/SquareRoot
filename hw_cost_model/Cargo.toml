[package]
name = "hw_cost_model"
version = "0.1.0"
edition = "2021"
description = "Area-delay-energy cost model: cubic bracket-zoom vs radix-2^b restoring square root"
license = "MIT"

[dependencies]
num-bigint = "0.5.1"
num-integer = "0.1.47"

[profile.release]
opt-level = 3
lto = true

[lib]
name = "hw_cost_model"
path = "src/lib.rs"

[[bin]]
name = "hw-cost-model"
path = "src/main.rs"
